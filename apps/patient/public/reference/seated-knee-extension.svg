<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Seated knee extension: seated with knee bent, then straightened level with the hip">
  <rect width="320" height="200" fill="#ECF0F1"/>
  <!-- chair -->
  <path d="M92 66 L92 150 M92 150 L60 150 M92 112 L60 112" stroke="#C2CCCD" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- start position, muted -->
  <g stroke="#C2CCCD" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="110" cy="52" r="11" fill="#C2CCCD" stroke="none"/>
    <path d="M110 63 L110 112"/>
    <path d="M110 112 L146 112"/>
    <path d="M146 112 L146 156"/>
  </g>
  <!-- end position, active -->
  <g stroke="#0D6E68" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="110" cy="52" r="11" fill="#0D6E68" stroke="none"/>
    <path d="M110 63 L110 112"/>
    <path d="M110 112 L146 112"/>
    <path d="M146 112 L214 112"/>
  </g>
  <circle cx="146" cy="112" r="6" fill="#FFC24D"/>
  <circle cx="214" cy="112" r="6" fill="#FFC24D"/>
  <!-- motion arc -->
  <path d="M170 150 A 46 46 0 0 0 186 116" stroke="#0D6E68" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <path d="M181 122 L187 114 L193 122" stroke="#0D6E68" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="232" y="108" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0D6E68">Straighten</text>
  <text x="232" y="124" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#64748B">then lower slowly</text>
</svg>
