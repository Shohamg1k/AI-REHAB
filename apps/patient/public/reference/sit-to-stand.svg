<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Sit to stand: from seated, lean forward and push up to standing">
  <rect width="320" height="200" fill="#F6F8FB"/>
  <!-- chair -->
  <path d="M96 66 L96 156 M96 156 L62 156 M96 116 L62 116" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- seated, muted -->
  <g stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="114" cy="60" r="11" fill="#CBD5E1" stroke="none"/>
    <path d="M114 71 L114 116"/>
    <path d="M114 116 L152 116"/>
    <path d="M152 116 L152 164"/>
  </g>
  <!-- standing, active -->
  <g stroke="#0F766E" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="216" cy="42" r="12" fill="#0F766E" stroke="none"/>
    <path d="M216 54 L216 112"/>
    <path d="M216 112 L216 164"/>
  </g>
  <circle cx="216" cy="112" r="6" fill="#F59E0B"/>
  <circle cx="216" cy="164" r="6" fill="#F59E0B"/>
  <circle cx="152" cy="116" r="6" fill="#F59E0B"/>
  <!-- motion arrow -->
  <path d="M168 96 Q 192 66 208 58" stroke="#0F766E" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <path d="M200 56 L210 56 L209 66" stroke="#0F766E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="186" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Lean forward, then push up to fully upright</text>
</svg>
