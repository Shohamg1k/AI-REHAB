name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package boundaries (ARCHITECTURE.md §3)
        run: pnpm run lint:boundaries

      - name: Build
        run: pnpm run build

      - name: Typecheck
        # Runs after Build: packages have no project-reference wiring, so
        # cross-package type resolution (e.g. packages/core importing
        # @ai-rehab/contracts) reads the *built* dist/index.d.ts. Typecheck
        # before Build would fail on a clean checkout with no dist/ yet.
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Eval harness — fixture replay (I2)
        run: pnpm run eval

      - name: Post eval report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'packages/eval/report.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
