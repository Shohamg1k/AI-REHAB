<text id="t-s-38" x="297" y="215.41" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Sit to stand stopped on reps 6–8 — knee flexion 96° against your 90° cap. She reported 2/5</text>
