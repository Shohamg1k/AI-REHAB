<text id="fld-73" x="445" y="436.23" font-family="Inter" font-size="15" font-weight="500" fill="#0f172a" xml:space="preserve">3s down</text>
<text id="t-c-74" x="530" y="405.21" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">WHY THIS ONE — SHOWN TO MAYA BEFORE THE SET</text>
<rect id="div-75" x="530" y="415.98" width="548" height="35.59" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text id="div-76" x="543" y="436.42" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Standing without your hands is the movement your knee has to relearn first.</text>
<rect id="div-77" x="330" y="463.58" width="748" height="59.19" rx="10" fill="#fdf0dc"/>
<text id="t-s-78" x="344" y="486.02" font-family="Inter" font-size="14" font-weight="400" fill="#7c3d06" xml:space="preserve">The progression rules hold this exercise at 2 × 8 this week — two safety blocks and a 4/5 pain report.</text>
<text id="t-s-79" x="344" y="505.61" font-family="Inter" font-size="14" font-weight="400" fill="#7c3d06" xml:space="preserve">Overriding is logged against your name.</text>
<rect id="card-80" x="310" y="554.77" width="788" height="151.8" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect id="div-81" x="329" y="573.77" width="44" height="44" rx="12" fill="#eef2f7"/>
<text id="t-t-82" x="385" y="590.04" font-family="Inter" font-size="17" font-weight="600" fill="#0f172a" xml:space="preserve">Standing hamstring curl</text>
<text id="t-c-83" x="385" y="609.29" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">Hamstrings · standing · needs balance support</text>
<text id="t-c-84" x="1071" y="597.38" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">⠿</text>
<text id="t-c-85" x="329" y="639.79" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">SETS</text>
<rect id="fld-num-86" x="329" y="650.56" width="40" height="37" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text id="fld-num-87" x="344" y="672.21" font-family="Inter" font-size="15" font-weight="500" fill="#0f172a" xml:space="preserve">3</text>
<text id="t-c-88" x="379" y="639.79" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">REPS</text>
<rect id="fld-num-89" x="379" y="650.56" width="50" height="37" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text id="fld-num-90" x="394" y="672.21" font-family="Inter" font-size="15" font-weight="500" fill="#0f172a" xml:space="preserve">10</text>
<text id="t-c-91" x="439" y="639.79" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">TEMPO</text>
<rect id="fld-92" x="439" y="650.56" width="66" height="37" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text id="fld-93" x="454" y="672.21" font-family="Inter" font-size="15" font-weight="500" fill="#0f172a" xml:space="preserve">Even</text>
<text id="t-c-94" x="515" y="641.19" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">WHY THIS ONE — SHOWN TO MAYA BEFORE THE SET</text>
<rect id="div-95" x="515" y="651.97" width="564" height="35.59" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text id="div-96" x="528" y="672.41" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Balances the back of the leg so the knee is not doing all the work.</text>
<rect id="disc-97" x="310" y="834.41" width="788" height="43.59" rx="10" fill="#eef2f7"/>
<text id="disc-98" x="344" y="858.85" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Programs and thresholds are clinical decisions made by you. The app enforces them; it does not set them.</text>
<rect id="card-tight-99" x="1130" y="111.8" width="278" height="318.36" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text id="t-t-100" x="1145" y="141.37" font-family="Inter" font-size="17" font-weight="600" fill="#0f172a" xml:space="preserve">Safety limits for Maya</text>
<text id="t-s-grow-101" x="1145" y="175.74" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Knee flexion cap</text>
<text id="t-b-num-102" x="1366" y="176.24" font-family="Inter" font-size="15" font-weight="600" fill="#0f172a" xml:space="preserve">90°</text>
<rect id="track-103" x="1145" y="189.59" width="248" height="10" rx="5" fill="#eef2f7"/>
<rect id="i-104" x="1145" y="189.59" width="138.88" height="10" rx="5" fill="#0f766e"/>
<rect id="div-105" x="1283.88" y="185.59" width="18" height="18" rx="9" fill="#0f766e" stroke="#ffffff" stroke-width="3"/>
<rect id="div-106" x="1363.23" y="183.59" width="2" height="22" fill="#b42318"/>
<text id="t-c-grow-107" x="1145" y="215.61" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">Tighter</text>
<text id="t-c-108" x="1298" y="215.61" font-family="Inter" font-size="12" font-weight="500" fill="#b42318" xml:space="preserve">Global floor 130°</text>
<text id="t-c-109" x="1145" y="244.41" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">You can tighten a limit for a patient you</text>
<text id="t-c-110" x="1145" y="261.21" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">know. You cannot loosen one past the floor</text>
<text id="t-c-111" x="1145" y="278" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">— that control does not exist.</text>
<rect id="div-112" x="1145" y="296.78" width="248" height="1" fill="#e2e8f0"/>
<text id="t-s-grow-113" x="1145" y="327.52" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Weight-bearing restriction</text>
<rect id="pill-p-mute-114" x="1350" y="309.78" width="43" height="30.19" rx="15.095" fill="#eef2f7"/>
<text id="pill-p-mute-115" x="1362" y="327.51" font-family="Inter" font-size="13" font-weight="600" fill="#475569" xml:space="preserve">Off</text>
<text id="t-s-grow-116" x="1145" y="369.71" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Standing exercises allowed</text>
<rect id="pill-p-ok-117" x="1351" y="351.97" width="42" height="30.19" rx="15.095" fill="#e6f5ec"/>
<text id="pill-p-ok-118" x="1363" y="369.7" font-family="Inter" font-size="13" font-weight="600" fill="#15803d" xml:space="preserve">On</text>
<text id="t-s-grow-119" x="1145" y="407.3" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Stop set after pain ≥</text>
<text id="t-b-num-120" x="1359" y="407.81" font-family="Inter" font-size="15" font-weight="600" fill="#0f172a" xml:space="preserve">4 / 5</text>
<rect id="card-tight-121" x="1130" y="444.16" width="278" height="162.17" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text id="t-t-122" x="1145" y="473.73" font-family="Inter" font-size="17" font-weight="600" fill="#0f172a" xml:space="preserve">What Maya will see</text>
<text id="t-s-123" x="1145" y="503.39" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">“Ruth has capped your knee bend at</text>
<text id="t-s-124" x="1145" y="522.99" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">90°. We will pause the set if you go</text>
<text id="t-s-125" x="1145" y="542.58" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">past it.”</text>
<text id="t-c-126" x="1145" y="567.75" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">Shown on the exercise card before every</text>
<text id="t-c-127" x="1145" y="584.55" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">set, with your name attached.</text>
<rect id="card-tight-128" x="1130" y="620.33" width="278" height="130.56" rx="16" fill="#eef2f7"/>
<text id="t-l-129" x="1144" y="646.06" font-family="Inter" font-size="13" font-weight="600" fill="#0f172a" xml:space="preserve">Changes are versioned</text>
<text id="t-s-130" x="1144" y="670.96" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Assigning writes a new program</text>
<text id="t-s-131" x="1144" y="690.55" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">version with your name and the</text>
<text id="t-s-132" x="1144" y="710.14" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">reason. The old one stays readable in</text>
<text id="t-s-133" x="1144" y="729.74" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">the audit trail.</text>
