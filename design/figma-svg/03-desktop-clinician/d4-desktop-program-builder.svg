<text id="t-c-56" x="539" y="240.41" font-family="Inter" font-size="12" font-weight="500" fill="#8a97a8" xml:space="preserve">WHY THIS ONE — SHOWN TO MAYA BEFORE THE SET</text>
<rect id="div-57" x="539" y="251.19" width="540" height="35.59" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text id="div-58" x="552" y="271.63" font-family="Inter" font-size="14" font-weight="400" fill="#475569" xml:space="preserve">Rebuilds the quad you need for stairs.</text>
<rect id="card-59" x="310" y="317.78" width="788" height="224.98" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
