<text id="btn-39" x="160" y="779.9" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#ffffff" xml:space="preserve">Start set 3</text>
<svg id="svg-40" x="20" y="812.91" width="13" height="13" viewBox="0 0 13 13" preserveAspectRatio="xMidYMid meet"><use href="#i-shield"></use></svg>
<text id="span-41" x="41" y="821.82" font-family="IBM Plex Sans" font-size="11.5" font-weight="400" fill="#7c8c8f" xml:space="preserve">Conversation is coaching, not clinical advice.</text>
