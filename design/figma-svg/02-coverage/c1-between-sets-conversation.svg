<text id="span-2" x="311" y="23.02" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#101617" xml:space="preserve">5G ▮▮▮</text>
<text id="h1-3" x="20" y="56.15" font-family="IBM Plex Sans" font-size="22" font-weight="600" fill="#101617" letter-spacing="-0.55" xml:space="preserve">Rest — 42s</text>
<text id="mono-4" x="20" y="76.73" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#7c8c8f" xml:space="preserve">SET 2 OF 3 DONE</text>
<rect id="chip-k-mute-5" x="303.38" y="48.86" width="66.63" height="24.33" rx="4" fill="#e2e8e9"/>
<text id="chip-k-mute-6" x="311.38" y="62.77" font-family="IBM Plex Mono" font-size="11.5" font-weight="500" fill="#47575a" letter-spacing="0.23" xml:space="preserve">CONCISE</text>
<rect id="div-7" x="20" y="95.03" width="30" height="30" rx="8" fill="#0d6e68"/>
<path id="card-hair-8" d="M70,95.03 H360 A10,10 0 0 1 370,105.03 V170.76 A10,10 0 0 1 360,180.76 H63 A3,3 0 0 1 60,177.76 V105.03 A10,10 0 0 1 70,95.03 Z" fill="#ffffff" stroke="#d6dedf" stroke-width="1"/>
<text id="span-9" x="72" y="119.58" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">That set was your steadiest yet — the</text>
<text id="span-10" x="72" y="140.15" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">lowering took a full three seconds on</text>
<text id="span-11" x="72" y="160.73" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">seven of eight.</text>
<rect id="div-12" x="20" y="192.77" width="30" height="30" rx="8" fill="#0d6e68"/>
<path id="card-hair-13" d="M70,192.77 H222 A10,10 0 0 1 232,202.77 V227.35000000000002 A10,10 0 0 1 222,237.35000000000002 H63 A3,3 0 0 1 60,234.35000000000002 V202.77 A10,10 0 0 1 70,192.77 Z" fill="#ffffff" stroke="#d6dedf" stroke-width="1"/>
<text id="span-14" x="72" y="217.31" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">How did that set feel?</text>
<rect id="chip-k-mute-15" x="206.61" y="249.34" width="57.05" height="34.45" rx="4" fill="#e2e8e9"/>
<text id="chip-k-mute-16" x="218.61" y="268.57" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#47575a" letter-spacing="0.26" xml:space="preserve">Fine</text>
<rect id="chip-k-mute-17" x="271.66" y="249.34" width="98.34" height="34.45" rx="4" fill="#e2e8e9"/>
<text id="chip-k-mute-18" x="283.66" y="268.57" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#47575a" letter-spacing="0.26" xml:space="preserve">Hard work</text>
<rect id="chip-19" x="189.05" y="291.8" width="180.95" height="34.45" rx="4" fill="#0d6e68"/>
<text id="chip-20" x="201.05" y="311.03" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#ffffff" letter-spacing="0.26" xml:space="preserve">Tiring, not painful</text>
<rect id="div-21" x="20" y="338.25" width="30" height="30" rx="8" fill="#0d6e68"/>
<path id="card-hair-22" d="M70,338.25 H360 A10,10 0 0 1 370,348.25 V413.98 A10,10 0 0 1 360,423.98 H63 A3,3 0 0 1 60,420.98 V348.25 A10,10 0 0 1 70,338.25 Z" fill="#ffffff" stroke="#d6dedf" stroke-width="1"/>
<text id="span-23" x="72" y="362.79" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">Then we will keep the last set at eight</text>
<text id="span-24" x="72" y="383.37" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">rather than pushing to ten. Tired is fine.</text>
<text id="span-25" x="72" y="403.95" font-family="IBM Plex Sans" font-size="14.5" font-weight="400" fill="#101617" xml:space="preserve">Sore is not.</text>
<rect id="card-26" x="20" y="435.98" width="350" height="128.16" rx="10" fill="#f8ebd9"/>
<svg id="svg-27" x="34" y="450.44" width="14" height="14" viewBox="0 0 14 14" preserveAspectRatio="xMidYMid meet"><use href="#i-sound"></use></svg>
<text id="lb-28" x="55" y="459.19" font-family="IBM Plex Mono" font-size="10.5" font-weight="500" fill="#a75a0b" letter-spacing="1.05" xml:space="preserve">TONE CHANGED</text>
<text id="b2-29" x="34" y="483.73" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#7a4208" xml:space="preserve">You have found this exercise hard three sessions</text>
<text id="b2-30" x="34" y="503.29" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#7a4208" xml:space="preserve">running, so the coach has switched from</text>
<text id="b2-31" x="34" y="522.85" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#7a4208" xml:space="preserve">encouraging to concise. You can change this any</text>
<text id="b2-32" x="34" y="542.41" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#7a4208" xml:space="preserve">time in settings.</text>
<rect id="sunk-33" x="20" y="576.14" width="350" height="103.33" rx="10" fill="#e2e8e9"/>
<text id="lb-34" x="34" y="599.35" font-family="IBM Plex Mono" font-size="10.5" font-weight="500" fill="#7c8c8f" letter-spacing="1.05" xml:space="preserve">RECORDED FROM THIS EXCHANGE</text>
<text id="mono-35" x="34" y="622.36" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#47575a" xml:space="preserve">readiness · “tiring, not painful”</text>
<text id="mono-36" x="34" y="640.5" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#47575a" xml:space="preserve">pain_reported · none volunteered</text>
<text id="mono-37" x="34" y="658.64" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#47575a" xml:space="preserve">set 3 · reps 10 → 8 · reason: patient report</text>
