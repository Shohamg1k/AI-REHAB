<rect id="div-0" x="0" y="0" width="390" height="844" rx="4" fill="#ecf0f1"/>
<text id="span-1" x="22" y="23.02" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#101617" xml:space="preserve">9:41</text>
<text id="span-2" x="311" y="23.02" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#101617" xml:space="preserve">5G ▮▮▮</text>
<text id="lb-3" x="20" y="50.24" font-family="IBM Plex Mono" font-size="10.5" font-weight="500" fill="#7c8c8f" letter-spacing="1.05" xml:space="preserve">FIRST SESSION · BASELINE</text>
<text id="d1-4" x="20" y="83.03" font-family="IBM Plex Sans" font-size="29" font-weight="600" fill="#101617" letter-spacing="-0.87" xml:space="preserve">Let's measure</text>
<text id="d1-5" x="20" y="116.07" font-family="IBM Plex Sans" font-size="29" font-weight="600" fill="#101617" letter-spacing="-0.87" xml:space="preserve">your range</text>
<text id="b2-6" x="20" y="143.87" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">Bend and straighten as far as is comfortable. Nothing</text>
<text id="b2-7" x="20" y="163.43" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">here is scored — we are finding your starting point, not</text>
<text id="b2-8" x="20" y="182.99" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">marking it.</text>
<rect id="cam-9" x="20" y="204.72" width="350" height="196" rx="20" fill="#2a3439"/>
<svg id="svg-10" x="20" y="204.72" width="350" height="196" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><use href="#scene" width="400" height="600"></use></svg>
<svg id="svg-11" x="20" y="204.72" width="350" height="196" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><use href="#pose" width="400" height="600"></use></svg>
<rect id="ovl-live-12" x="30" y="214.72" width="191.88" height="25.61" rx="4" fill="#0c1414" fill-opacity="0.620"/>
<rect id="i-13" x="39" y="224.02" width="7" height="7" rx="3.5" fill="#ff5c4d"/>
<text id="ovl-live-14" x="52" y="229.03" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#ffffff" letter-spacing="0.66" xml:space="preserve">MEASURING · LEFT KNEE</text>
<rect id="ovl-readout-mono-15" x="294" y="347.75" width="66" height="42.97" rx="8" fill="#0c1414" fill-opacity="0.680"/>
<text id="ovl-readout-mono-16" x="305" y="372.74" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#ffffff" xml:space="preserve">104°</text>
<rect id="card-hair-17" x="20" y="412.72" width="350" height="215.19" rx="10" fill="#ffffff" stroke="#d6dedf" stroke-width="1"/>
<text id="lb-18" x="34" y="435.92" font-family="IBM Plex Mono" font-size="10.5" font-weight="500" fill="#7c8c8f" letter-spacing="1.05" xml:space="preserve">YOUR RANGE TODAY</text>
<text id="b2-19" x="34" y="466.32" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">Left knee (operated)</text>
<text id="mono-20" x="320" y="467.28" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#b5410a" xml:space="preserve">104°</text>
<rect id="track-21" x="34" y="479.92" width="322" height="6" rx="3" fill="#e2e8e9"/>
<rect id="i-22" x="34" y="479.92" width="212.52" height="6" rx="3" fill="#b5410a"/>
<text id="b2-23" x="34" y="510.62" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">Right knee</text>
<text id="mono-24" x="320" y="511.57" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#1f7a4d" xml:space="preserve">128°</text>
<rect id="track-25" x="34" y="524.22" width="322" height="6" rx="3" fill="#e2e8e9"/>
<rect id="i-26" x="34" y="524.22" width="283.36" height="6" rx="3" fill="#1f7a4d"/>
<rect id="sep-27" x="34" y="542.22" width="322" height="1" fill="#d6dedf"/>
<text id="b2-28" x="34" y="567.05" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">Every score from now on is read against</text>
<text id="b-29" x="285" y="567.05" font-family="IBM Plex Sans" font-size="13.5" font-weight="700" fill="#101617" xml:space="preserve">these</text>
<text id="b-30" x="34" y="586.62" font-family="IBM Plex Sans" font-size="13.5" font-weight="700" fill="#101617" xml:space="preserve">numbers</text>
<text id="b2-31" x="93" y="586.62" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">, not against an average of other people.</text>
<text id="b2-32" x="34" y="606.18" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">That is what makes week-one progress visible.</text>
<rect id="sunk-33" x="20" y="639.91" width="350" height="107.59" rx="10" fill="#e2e8e9"/>
<svg id="svg-34" x="34" y="654.36" width="14" height="14" viewBox="0 0 14 14" preserveAspectRatio="xMidYMid meet"><use href="#i-chart"></use></svg>
<text id="lb-35" x="55" y="663.11" font-family="IBM Plex Mono" font-size="10.5" font-weight="500" fill="#7c8c8f" letter-spacing="1.05" xml:space="preserve">RE-MEASURED EVERY FOUR WEEKS</text>
<text id="b2-36" x="34" y="686.65" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">Ruth can ask for a re-measure sooner. Old</text>
<text id="b2-37" x="34" y="706.21" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">baselines stay in your record so the change is</text>
<text id="b2-38" x="34" y="725.77" font-family="IBM Plex Sans" font-size="13.5" font-weight="400" fill="#47575a" xml:space="preserve">visible.</text>
<rect id="btn-39" x="20" y="747.5" width="350" height="52" rx="8" fill="#0d6e68"/>
<text id="btn-40" x="101" y="776.49" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#ffffff" xml:space="preserve">Save baseline and continue</text>
<svg id="svg-41" x="20" y="809.5" width="13" height="13" viewBox="0 0 13 13" preserveAspectRatio="xMidYMid meet"><use href="#i-shield"></use></svg>
<text id="span-42" x="41" y="818.42" font-family="IBM Plex Sans" font-size="11.5" font-weight="400" fill="#7c8c8f" xml:space="preserve">A range of movement measurement, not an assessment of</text>
<text id="span-43" x="41" y="834.51" font-family="IBM Plex Sans" font-size="11.5" font-weight="400" fill="#7c8c8f" xml:space="preserve">your recovery.</text>
</svg>